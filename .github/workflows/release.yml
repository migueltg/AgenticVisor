name: Release

# Runs when a version tag such as v0.1.0-beta.1 is pushed.
# Builds the binary for each system, packages it with its checksum,
# and creates the GitHub release with those files attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $name = "agenticvisor-$version-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/agenticvisor.exe" $name
          Copy-Item README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          version="${{ github.ref_name }}"
          name="agenticvisor-$version-${{ matrix.name }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/agenticvisor" "$name/"
          cp README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: agenticvisor-*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Checksums
        working-directory: packages
        run: sha256sum agenticvisor-* > SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          # If a release for this tag already exists (re-run, or a release
          # made by hand), replace its files instead of failing.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" packages/* --clobber
            exit 0
          fi
          args=()
          # Versions with a suffix (beta, alpha, rc) are marked as pre-releases.
          if [[ "$tag" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$tag" packages/* \
            --title "AgenticVisor $tag" \
            --generate-notes \
            "${args[@]}"
