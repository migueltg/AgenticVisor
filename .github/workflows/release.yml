name: Release

# Runs when a version tag such as v0.1.0-beta.4 is pushed. For each system it builds
# the desktop app and the command line tool, packages them, and creates the GitHub
# release with the files and their checksums attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            bundles: app
          - name: linux-x64
            os: ubuntu-latest
            bundles: deb
          - name: windows-x64
            os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build the command line tool
        run: cargo build --release --locked

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the desktop app
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          mkdir -p dist
          tar -czf "dist/AgenticVisor-$tag-macos-arm64.tar.gz" -C target/release/bundle/macos AgenticVisor.app
          cli="agenticvisor-cli-$tag-macos-arm64"
          mkdir "$cli" && cp target/release/agenticvisor README.md LICENSE "$cli/"
          tar -czf "dist/$cli.tar.gz" "$cli"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          mkdir -p dist
          cp target/release/bundle/deb/*.deb "dist/AgenticVisor-$tag-linux-x64.deb"
          cli="agenticvisor-cli-$tag-linux-x64"
          mkdir "$cli" && cp target/release/agenticvisor README.md LICENSE "$cli/"
          tar -czf "dist/$cli.tar.gz" "$cli"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName "dist/AgenticVisor-$tag-windows-x64-setup.exe"
          $cli = "agenticvisor-cli-$tag-windows-x64"
          New-Item -ItemType Directory -Path $cli | Out-Null
          Copy-Item target/release/agenticvisor.exe, README.md, LICENSE $cli
          Compress-Archive -Path $cli -DestinationPath "dist/$cli.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Checksums
        working-directory: packages
        run: sha256sum AgenticVisor-* agenticvisor-cli-* > SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          # If a release for this tag already exists (re-run, or a release
          # made by hand), replace its files instead of failing.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" packages/* --clobber
            exit 0
          fi
          args=()
          # Versions with a suffix (beta, alpha, rc) are marked as pre-releases.
          if [[ "$tag" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$tag" packages/* \
            --title "AgenticVisor $tag" \
            --generate-notes \
            "${args[@]}"
